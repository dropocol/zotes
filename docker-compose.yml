# Local Postgres for zotes (replaces the Supabase local database).
# Same host port / credentials as the old Supabase db, so DATABASE_URL is unchanged:
#   postgresql://postgres:postgres@127.0.0.1:54922/postgres
services:
  db:
    image: postgres:17-alpine
    container_name: zotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54922:5432"
    volumes:
      - zotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zotes_pgdata:
